[package]
name = "lilja-mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# 非同期処理を実行するための基盤（ランタイム）
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "time", "io-util"] }
# データのシリアライズ（保存形式への変換）とデシリアライズ（復元）を行う共通フレームワーク
serde = { version = "1.0", features = ["derive"] }
# JSON形式のデータを扱うためのライブラリ（serdeと連携）
serde_json = "1.0"
# エラー処理を柔軟かつ簡潔に書くためのライブラリ
anyhow = "1.0"
# ファイルシステムの変更を監視するためのライブラリ
notify = "6.1"
